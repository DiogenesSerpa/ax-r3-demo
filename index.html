<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; frame-src 'self' blob:; connect-src 'self' https://ccatstxkewcaozxwknfy.supabase.co; object-src 'none'; base-uri 'self'; form-action 'none'"><title>Proposta privada · Testes AX 2012 R3</title><link rel="stylesheet" href="acesso.css"></head>
<body><main id="login" class="login"><div class="mark"></div><div class="eyebrow">D&S Tech Consulting · Grupo LINK</div><h1>Testes automatizados<br>AX 2012 R3</h1><p>Acesse a proposta completa, os mocks e o levantamento de escopo.</p><form id="login-form"><label>E-mail<input id="email" type="email" autocomplete="username" required></label><label>Senha de avaliação<input id="password" type="password" autocomplete="current-password" required></label><button id="enter" type="submit">Abrir proposta</button><div class="error" id="error" role="alert"></div></form><p class="small">Acesso reservado para avaliação. O conteúdo da proposta é criptografado. As respostas e os apontamentos enviados são registrados para análise.</p></main>
<section id="session" hidden><header class="sessionbar"><div class="left"><button id="home" type="button">Alternativas</button><button id="back-proposal" type="button" hidden>Voltar à proposta</button><span class="identity" id="identity"></span></div><div class="right"><button id="review" type="button">Registrar apontamento</button><button id="admin-link" type="button">Área administrativa</button><button id="logout" type="button">Sair</button></div></header><iframe id="demo-frame" title="Proposta e simulações de testes AX 2012 R3"></iframe></section>
<dialog id="feedback-dialog" class="feedback-dialog" aria-labelledby="fb-title"><div class="fb-header"><h2 id="fb-title">Registrar apontamento</h2><button type="button" id="fb-close" aria-label="Fechar apontamento">×</button></div><div class="fb-body"><form id="feedback-form"><div class="fb-context"><span id="fb-context"></span><small id="fb-quote"></small><button id="fb-context-refresh" type="button">Usar a tela atual como referência</button></div><div class="fb-grid"><label>Seu nome<input name="name" id="fb-name" required minlength="2" maxlength="150"></label><label>E-mail<input name="email" id="fb-email" type="email" required maxlength="254"></label><label>Opção<select name="option" id="fb-option"><option value="integrated_ax">01 · Integrada ao AX</option><option value="web">02 · Portal web</option></select></label><label>Tipo de apontamento<select name="category"><option>Dúvida</option><option>Sugestão</option><option>Ajuste funcional</option><option>Ajuste visual</option><option>Erro na simulação</option></select></label><label>Prioridade<select name="priority"><option>A avaliar</option><option>Bloqueante</option><option>Importante</option><option>Melhoria</option></select></label><label>Campo, trecho ou ação de referência<input name="reference" maxlength="200" placeholder="Ex.: botão Executar grupo"></label></div><label>Sua observação<textarea name="message" id="fb-message" required maxlength="4000" rows="5" placeholder="Descreva a dúvida, o comportamento esperado ou a alteração sugerida."></textarea></label><label class="fb-check"><input type="checkbox" name="consent" id="fb-consent" required><span>Autorizo o registro deste apontamento para análise da proposta.</span></label><p id="fb-draft"></p><button id="fb-submit" type="submit">Salvar apontamento</button><div id="fb-result" role="status" aria-live="polite"></div></form></div></dialog>
<script src="acesso.js"></script></body></html>
